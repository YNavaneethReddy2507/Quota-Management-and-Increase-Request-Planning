# ==============================================================================
# Google Cloud Build Pipeline
# Builds container images and deploys full-stack services to Google Cloud Run
# ==============================================================================

steps:
  # 1. Build Backend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/quota-control-plane-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/quota-control-plane-backend:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '.'

  # 2. Build Frontend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/quota-control-plane-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/quota-control-plane-frontend:latest'
      - '-f'
      - 'Dockerfile.frontend'
      - '.'

  # 3. Push Backend Image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/quota-control-plane-backend:$COMMIT_SHA'

  # 4. Push Frontend Image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/quota-control-plane-frontend:$COMMIT_SHA'

  # 5. Deploy Backend to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'quota-control-plane-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/quota-control-plane-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '5000'

  # 6. Deploy Frontend to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'quota-control-plane-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/quota-control-plane-frontend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'

images:
  - 'gcr.io/$PROJECT_ID/quota-control-plane-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/quota-control-plane-backend:latest'
  - 'gcr.io/$PROJECT_ID/quota-control-plane-frontend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/quota-control-plane-frontend:latest'

timeout: '1200s'
